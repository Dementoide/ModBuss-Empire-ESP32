; ModbusEmpire: consola de banco para sensores Modbus RTU sobre RS485.
; Framework ESP-IDF puro sobre el platform oficial platformio/espressif32. Las fuentes propias
; entran por src/CMakeLists.txt; los componentes del IDF por src/idf_component.yml.

[env]
platform = platformio/espressif32@8.0.0
board = esp32dev_16MB
framework = espidf
monitor_speed = 115200
monitor_eol = LF
board_build.filesystem = littlefs
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
lib_ldf_mode = off

[env:esp32dev]

; Suite Unity en la placa: pio test -e test
; main.cpp queda fuera con TEST_MODE (la suite trae su propio app_main).
[env:test]
build_flags = -D TEST_MODE
test_build_src = true
